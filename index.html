<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>NeatNest Inventory Management</title>
    <meta name="description" content="Inventory, point of sale, procurement, and logistics management" />
    <meta name="author" content="NeatNest" />
    <link rel="icon" type="image/svg+xml" href="/neatnest-lotus-mark.svg" />
    <link rel="alternate icon" type="image/png" href="/neatnest-lotus-logo.png" />
    <link rel="apple-touch-icon" href="/neatnest-lotus-mark.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="NeatNest Inventory Management" />
    <meta
      property="og:description"
      content="Inventory, point of sale, procurement, and logistics management"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          let prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          theme = prefersDark ? "dark" : "light";
        }
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    </script>

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
